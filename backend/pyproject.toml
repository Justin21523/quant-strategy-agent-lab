[project]
name = "quant-strategy-agent-lab-api"
version = "0.2.0"
description = "FastAPI backend for Quant Strategy Agent Lab"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
