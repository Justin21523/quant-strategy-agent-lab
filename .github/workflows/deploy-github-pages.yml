name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish docs/pages to gh-pages
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          cp -a docs/pages/. "$tmp_dir/"
          touch "$tmp_dir/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-deploy
          git rm -rf .
          cp -a "$tmp_dir"/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No GitHub Pages changes to publish."
            exit 0
          fi
          git commit -m "Deploy GitHub Pages from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages --force
